project_id = "days-capstone"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17
health_timeout = "2m"

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]

[studio]
enabled = true

[local_smtp]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[experimental]
stack = true
