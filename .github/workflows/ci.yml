name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and lint
        run: bun run check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - parallel:
          - name: Set up Bun
            uses: ./.github/actions/setup-bun

          - name: Cache Turborepo tasks
            uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
            with:
              path: .turbo/cache
              key: ${{ runner.os }}-${{ runner.arch }}-turbo-${{ github.job }}-${{ github.sha }}
              restore-keys: |
                ${{ runner.os }}-${{ runner.arch }}-turbo-${{ github.job }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - parallel:
          - name: Set up Bun
            uses: ./.github/actions/setup-bun

          - name: Cache Turborepo tasks
            uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
            with:
              path: .turbo/cache
              key: ${{ runner.os }}-${{ runner.arch }}-turbo-${{ github.job }}-${{ github.sha }}
              restore-keys: |
                ${{ runner.os }}-${{ runner.arch }}-turbo-${{ github.job }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test and check migration snapshots
        run: bun run test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - parallel:
          - name: Set up Bun
            uses: ./.github/actions/setup-bun

          - name: Cache Turborepo tasks
            uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
            with:
              path: .turbo/cache
              key: ${{ runner.os }}-${{ runner.arch }}-turbo-${{ github.job }}-${{ github.sha }}
              restore-keys: |
                ${{ runner.os }}-${{ runner.arch }}-turbo-${{ github.job }}-

          - name: Cache Next.js
            uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
            with:
              path: .next/cache
              key: ${{ runner.os }}-next-${{ hashFiles('bun.lock', 'package.json') }}-${{ hashFiles('src/**', 'public/**', '*config*') }}
              restore-keys: |
                ${{ runner.os }}-next-${{ hashFiles('bun.lock', 'package.json') }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

  verify:
    name: Verify
    needs: [lint, typecheck, test, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verify results
        run: test "$PASSED" = true
        env:
          PASSED: ${{ needs.lint.result == 'success' && needs.typecheck.result == 'success' && needs.test.result == 'success' && needs.build.result == 'success' }}
